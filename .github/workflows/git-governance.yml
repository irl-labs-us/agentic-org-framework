name: Git governance

on:
  # This workflow must already exist on the pull request's trusted base. GitHub
  # therefore loads this definition from the base branch, not from candidate
  # content. Candidate files are checked out separately and are never executed.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # SHA-scoped, not just per-PR: if you adopt scripts/sync_pr_manifest.py or
  # create_release_pr.py --sync-mechanical (which re-run a stale run of this
  # workflow via `gh run rerun`, since GITHUB_TOKEN-authored PR edits don't
  # themselves trigger a fresh "edited" event), a rerun of an old failed run
  # must never land in the same concurrency group as an in-progress run for
  # a newer commit -- cancel-in-progress would cancel whichever run is
  # already queued/running when the other is queued, and a stale rerun
  # queued after a real run for a newer SHA would wrongly cancel the real
  # one. Per-SHA groups mean different commits can never cancel each other;
  # the "superseded" live-head-vs-event-head check below remains the
  # correctness backstop for a stale run that completes anyway.
  group: git-governance-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  covenant:
    name: Git operations covenant
    # This repo is the template source itself, not an instantiated project — it has
    # no staging branch and doesn't follow the staging->main release flow this check
    # enforces, so it can never pass here. The condition is a literal match on this
    # repo's own full name, so it only suppresses the check here; any project created
    # from "Use this template" gets a different github.repository value and the
    # check runs normally there.
    if: github.repository != 'irl-labs-us/agentic-org-framework'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out trusted base policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-policy
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact pull-request head as untrusted data
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare trusted policy and candidate history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test -f trusted-policy/scripts/check_git_governance.py
          test -f trusted-policy/scripts/framework_config.py
          test -f trusted-policy/.agentic-org.json
          # Import the base object from the local trusted checkout. This works
          # for private repositories without persisting a token in either Git
          # checkout or exposing credentials to candidate processing.
          git -C candidate remote add trusted-base "$GITHUB_WORKSPACE/trusted-policy"
          git -C candidate fetch --no-tags trusted-base "$BASE_SHA"
          echo "GOVERNANCE_POLICY_DIR=$GITHUB_WORKSPACE/trusted-policy/scripts" >> "$GITHUB_ENV"
          echo "GOVERNANCE_CONFIG=$GITHUB_WORKSPACE/trusted-policy/.agentic-org.json" >> "$GITHUB_ENV"
          echo "CANDIDATE_REPO=$GITHUB_WORKSPACE/candidate" >> "$GITHUB_ENV"

      - name: Collect live pull-request metadata and branch history
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          live_metadata="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body,headRefOid)"
          live_head_sha="$(jq -r '.headRefOid' <<< "$live_metadata")"
          if [[ "$live_head_sha" != "$EVENT_HEAD_SHA" ]]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "Skipping superseded event head $EVENT_HEAD_SHA; current PR head is $live_head_sha."
            exit 0
          fi
          echo "superseded=false" >> "$GITHUB_OUTPUT"
          jq -r '.body // ""' <<< "$live_metadata" > "$RUNNER_TEMP/git-governance-pr-body.md"
          prior_pr_count="$(gh pr list --repo "$GITHUB_REPOSITORY" --state all --head "$HEAD_REF" --limit 100 --json number --jq "[.[] | select(.number != $PR_NUMBER)] | length")"
          echo "prior_pr_count=$prior_pr_count" >> "$GITHUB_OUTPUT"

      - name: Enforce covenant
        if: steps.metadata.outputs.superseded != 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PRIOR_PR_COUNT: ${{ steps.metadata.outputs.prior_pr_count }}
        run: |
          config_args=()
          if [[ -n "${GOVERNANCE_CONFIG:-}" ]]; then
            config_args+=(--config "$GOVERNANCE_CONFIG")
          fi
          python "$GOVERNANCE_POLICY_DIR/check_git_governance.py" \
            --repo "$CANDIDATE_REPO" \
            --base-ref "$BASE_REF" \
            --head-ref "$HEAD_REF" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --body-file "$RUNNER_TEMP/git-governance-pr-body.md" \
            --prior-pr-count "$PRIOR_PR_COUNT" \
            "${config_args[@]}"
