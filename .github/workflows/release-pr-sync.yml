name: Sync release PR

# Root cause this exists to fix: the Git operations covenant requires a
# release PR's "## Changed-file manifest" / "## Branch integration" sections
# to exactly match staging's current diff against main -- correct as a
# safety property (it's what actually catches a stale/wrong PR body), but it
# means any *open* staging->main release PR goes stale the instant another
# commit lands on staging, and the "Git governance" check (git-governance.yml)
# fails again until someone manually re-renders the body. This workflow
# closes that gap by re-rendering only the mechanically-derived sections
# automatically on every push to staging, while leaving the human-written
# Outcome / Coordination and scope / Evidence sections untouched -- so a
# curated review trail is never silently discarded by an automated refresh.
#
# This is a no-op (not a failure) if no release PR is currently open --
# it never opens one itself.
#
# After editing the PR body, this also re-runs "Git operations covenant"
# (git-governance.yml) if its last run for this exact head SHA failed --
# GitHub does not deliver a fresh pull_request "edited" event for edits
# made by the ambient GITHUB_TOKEN (loop prevention), so without this the
# covenant check would sit on its stale failure forever even after the
# manifest that caused it is fixed. Requires actions: write to call
# `gh run rerun`.

on:
  push:
    branches: [staging]

permissions:
  contents: read
  pull-requests: write
  actions: write

concurrency:
  group: release-pr-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Refresh open release PR's mechanical sections
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh Branch integration / Changed-file manifest, if a release PR is open
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_SLUG: ${{ github.repository }}
        run: >-
          python scripts/create_release_pr.py
          --repo .
          --repo-slug "$REPO_SLUG"
          --base main
          --head staging
          --solo-mode
          --sync-mechanical
