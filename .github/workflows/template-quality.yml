name: Template quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: template-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Template tests and adoption matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "pytest>=8,<10"
      - name: Unit and conformance tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q scripts
      - name: Validate workflows, links, placeholders, profiles, and branches
        run: python scripts/template_quality.py
